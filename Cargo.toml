[workspace]
resolver = "2"
members = [
    "crates/oxide-core",
    "crates/oxide-dsp",
    "crates/oxide-drums",
    "crates/oxide-fx",
    "crates/oxide-audio",
    "crates/oxide-bounce",
    "crates/oxide-timeline",
    "crates/oxide-project",
    "crates/oxide-plugin-scanner",
    "crates/oxide-gui",
    "crates/oxide-mcp",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/juancruzmunozalbelo/oxide-studio"
homepage = "https://juancruzmunozalbelo.github.io/oxide-studio/"
authors = ["Juan Cruz Muñoz Albelo and Oxide Studio Contributors"]
description = "Clean-room native electronic music DAW & workstation in Rust"
