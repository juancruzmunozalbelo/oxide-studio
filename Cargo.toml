[workspace]
resolver = "2"
members = [
    "crates/ableton-core",
    "crates/ableton-dsp",
    "crates/ableton-drums",
    "crates/ableton-fx",
    "crates/ableton-audio",
    "crates/ableton-bounce",
    "crates/ableton-timeline",
    "crates/ableton-project",
    "crates/ableton-plugin-scanner",
    "crates/ableton-gui",
    "crates/ableton-mcp",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/juancruzmunozalbelo/oxide-studio"
homepage = "https://juancruzmunozalbelo.github.io/oxide-studio/"
authors = ["Juan Cruz Muñoz Albelo and Oxide Studio Contributors"]
description = "Clean-room native electronic music DAW & workstation in Rust"
