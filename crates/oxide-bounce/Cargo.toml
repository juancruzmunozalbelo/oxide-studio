[package]
name = "oxide-bounce"
version = "1.0.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
oxide-core = { path = "../oxide-core" }
oxide-dsp = { path = "../oxide-dsp" }
oxide-drums = { path = "../oxide-drums" }
oxide-fx = { path = "../oxide-fx" }
oxide-project = { path = "../oxide-project" }
oxide-timeline = { path = "../oxide-timeline" }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[[test]]
name = "e2e_dsp_filter_test"
