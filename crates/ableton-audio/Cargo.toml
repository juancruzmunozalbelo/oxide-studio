[package]
name = "ableton-audio"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
ableton-core = { path = "../ableton-core" }
ableton-dsp = { path = "../ableton-dsp" }
ableton-drums = { path = "../ableton-drums" }
ableton-fx = { path = "../ableton-fx" }
ableton-timeline = { path = "../ableton-timeline" }
cpal = "0.18"
rtrb = "0.4"
portable-atomic = { version = "1.15", features = ["float"] }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]
