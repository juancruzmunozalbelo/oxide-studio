[package]
name = "ableton-plugin-scanner"
version = "1.0.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
ableton-core = { path = "../ableton-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[[bin]]
name = "ableton-plugin-scanner"
path = "src/bin/main.rs"

[lib]
name = "ableton_plugin_scanner"
path = "src/lib.rs"
