[package]
name = "ableton-gui"
version = "0.1.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
default-run = "ableton-rust"

[lib]
name = "ableton_gui"
path = "src/lib.rs"

[[bin]]
name = "ableton-rust"
path = "../../src/main.rs"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "wgpu"] }
egui = "0.29"
ableton-core = { path = "../ableton-core" }
ableton-dsp = { path = "../ableton-dsp" }
ableton-drums = { path = "../ableton-drums" }
ableton-fx = { path = "../ableton-fx" }
ableton-audio = { path = "../ableton-audio" }
ableton-bounce = { path = "../ableton-bounce" }
ableton-timeline = { path = "../ableton-timeline" }
ableton-project = { path = "../ableton-project" }
ableton-plugin-scanner = { path = "../ableton-plugin-scanner" }
ableton-mcp = { path = "../ableton-mcp" }

[[test]]
name = "e2e_m11_gui_test"
path = "../../tests/e2e_m11_gui_test.rs"

[[test]]
name = "e2e_live12_clip_view_test"
path = "tests/e2e_live12_clip_view_test.rs"

[[test]]
name = "e2e_live12_sync_sequencer_test"
path = "tests/e2e_live12_sync_sequencer_test.rs"

[[test]]
name = "e2e_live12_layout_audit_test"
path = "tests/e2e_live12_layout_audit_test.rs"

[[test]]
name = "adversarial_m1_m3_test"
path = "tests/adversarial_m1_m3_test.rs"

[[test]]
name = "adversarial_m2_m4_test"
path = "tests/adversarial_m2_m4_test.rs"

[[test]]
name = "e2e_ableton_manual_verification_test"
path = "tests/e2e_ableton_manual_verification_test.rs"

[[test]]
name = "adversarial_acoustic_layout_stress_test"
path = "tests/adversarial_acoustic_layout_stress_test.rs"

