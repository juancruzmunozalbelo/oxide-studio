[package]
name = "ableton-bounce"
version = "1.0.0"
edition = "2021"
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true

[dependencies]
ableton-core = { path = "../ableton-core" }
ableton-dsp = { path = "../ableton-dsp" }
ableton-drums = { path = "../ableton-drums" }
ableton-fx = { path = "../ableton-fx" }
ableton-project = { path = "../ableton-project" }
ableton-timeline = { path = "../ableton-timeline" }
serde = { version = "1.0", features = ["derive"], optional = true }

[features]
default = []
serde = ["dep:serde"]

[[test]]
name = "e2e_dsp_filter_test"
path = "../../tests/e2e_dsp_filter_test.rs"

[[test]]
name = "e2e_monophonic_presets_test"
path = "../../tests/e2e_monophonic_presets_test.rs"

[[test]]
name = "e2e_drum_rack_test"
path = "../../tests/e2e_drum_rack_test.rs"

[[test]]
name = "e2e_bounce_render_test"
path = "../../tests/e2e_bounce_render_test.rs"

[[test]]
name = "e2e_m8_instruments_test"
path = "../../tests/e2e_m8_instruments_test.rs"

[[test]]
name = "adversarial_m8_stress_test"
path = "../../tests/adversarial_m8_stress_test.rs"

[[test]]
name = "e2e_m8_adversarial_filters_synths_test"
path = "../../tests/e2e_m8_adversarial_filters_synths_test.rs"

[dev-dependencies]
ableton-timeline = { path = "../ableton-timeline" }
ableton-plugin-scanner = { path = "../ableton-plugin-scanner" }
ableton-audio = { path = "../ableton-audio" }

[[test]]
name = "e2e_m9_chains_fx_test"
path = "../../tests/e2e_m9_chains_fx_test.rs"

[[test]]
name = "adversarial_m9_stress_test"
path = "../../tests/adversarial_m9_stress_test.rs"

[[test]]
name = "e2e_m10_warping_mixer_test"
path = "../../tests/e2e_m10_warping_mixer_test.rs"

