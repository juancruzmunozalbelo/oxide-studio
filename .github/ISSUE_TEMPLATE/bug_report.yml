name: "Bug Report"
description: "File a bug report for Oxide Studio audio engine, GUI, DSP devices, or MCP server"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report an issue! Please provide as much technical detail as possible.
  - type: dropdown
    id: subsystem
    attributes:
      label: Affected Subsystem
      description: Which part of Oxide Studio is exhibiting the issue?
      options:
        - "Audio Engine (CoreAudio / cpal / latency / buffers)"
        - "DSP Device / Synthesis (Oscillator, Filter, Envelope, Roar, EQ)"
        - "Drum Machine / Sampler (909, Simpler, DrumRack128)"
        - "Session Matrix & Timeline (Clips, Scenes, Warping, Automation)"
        - "Studio GUI Layout (Viewport, Piano Roll, Mixer, Visualizers)"
        - "Model Context Protocol Server (MCP stdio / JSON-RPC / Tools)"
        - "Plugin Scanner & Hosting (AUv2, VST3, CLAP supervisor)"
        - "Project Persistence (.aruston.json, .als import/export)"
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating System & Hardware
      description: e.g. macOS 14.5 Sonoma (Apple M2 Max), Rust 1.81.0
      placeholder: macOS 14.x / Apple Silicon
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Clear, step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Launch `ableton-rust`
        2. Create track with Wavetable
        3. Set resonance to 1.0 and sweep cutoff
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual Behavior / Error Logs
      description: What actually occurred? Paste crash logs, terminal output, or telemetry readings here.
      render: shell
    validations:
      required: true
