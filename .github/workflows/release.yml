name: Release Multi-Platform Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            archive_name: oxide-studio-v1.0.0-macos-arm64
            binary_name: ableton-rust
          - os: macos-13
            target: x86_64-apple-darwin
            archive_name: oxide-studio-v1.0.0-macos-x86_64
            binary_name: ableton-rust
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive_name: oxide-studio-v1.0.0-linux-x86_64
            binary_name: ableton-rust
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive_name: oxide-studio-v1.0.0-windows-x86_64
            binary_name: ableton-rust.exe

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux audio & GUI system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libasound2-dev \
            libjack-jackd2-dev \
            pkg-config \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxkbcommon-dev \
            libssl-dev \
            libgtk-3-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package native release bundle (Unix)
        if: runner.os != 'Windows'
        run: |
          STAGE="staging/${{ matrix.archive_name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$STAGE/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          cp docs/okf/OXIDE_STUDIO_MANUAL_OKF.md "$STAGE/"
          cd "$STAGE"
          shasum -a 256 * > SHA256SUMS.txt || sha256sum * > SHA256SUMS.txt
          cd ../..
          mkdir -p dist
          tar -czf "dist/${{ matrix.archive_name }}.tar.gz" -C staging "${{ matrix.archive_name }}"
          cd staging && zip -r "../dist/${{ matrix.archive_name }}.zip" "${{ matrix.archive_name }}" && cd ..

      - name: Package native release bundle (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          STAGE="staging/${{ matrix.archive_name }}"
          mkdir -p "$STAGE"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_name }}" "$STAGE/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          cp docs/okf/OXIDE_STUDIO_MANUAL_OKF.md "$STAGE/"
          cd "$STAGE"
          sha256sum * > SHA256SUMS.txt
          cd ../..
          mkdir -p dist
          cd staging && 7z a "../dist/${{ matrix.archive_name }}.zip" "${{ matrix.archive_name }}" && cd ..

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: dist/*

  publish-release:
    name: Aggregate Checksums & Publish Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: downloaded-artifacts
          merge-multiple: true

      - name: Generate master SHA256SUMS.txt
        run: |
          mkdir -p release-assets
          cp downloaded-artifacts/* release-assets/
          cd release-assets
          sha256sum *.tar.gz *.zip > SHA256SUMS.txt
          ls -la

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: release-assets/*
          generate_release_notes: true
